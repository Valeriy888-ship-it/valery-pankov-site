        /* Loader with scissors animation */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--primary-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .scissors {
            position: relative;
            width: 80px;
            height: 80px;
        }

        .scissor {
            position: absolute;
            width: 40px;
            height: 8px;
            background: var(--secondary-color);
            border-radius: 4px;
            transform-origin: left center;
        }

        .scissor-left {
            top: 36px;
            left: 0;
            transform: rotate(-20deg);
            animation: scissor-left 1.5s ease-in-out infinite;
        }

        .scissor-right {
            top: 36px;
            right: 0;
            transform: rotate(20deg);
            animation: scissor-right 1.5s ease-in-out infinite;
        }

        .scissors-handle {
            position: absolute;
            width: 12px;
            height: 12px;
            background: var(--secondary-color);
            border-radius: 50%;
            top: 30px;
            left: 36px;
        }

        .scissors-handle-right {
            left: auto;
            right: 36px;
        }

        @keyframes scissor-left {
            0%, 100% { transform: rotate(-20deg); }
            50% { transform: rotate(5deg); }
        }

        @keyframes scissor-right {
            0%, 100% { transform: rotate(20deg); }
            50% { transform: rotate(-5deg); }
        }
